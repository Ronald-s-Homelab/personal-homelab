# Chaves no Doppler (ClusterSecretStore doppler-css):
#   PGMANAGER_JWT_SECRET     -> 32+ caracteres aleatórios
#   PGMANAGER_CNPG_PASSWORD  -> 16+ caracteres de [A-Za-z0-9._~-] (entra literal na DSN)
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pgsqlmanager-backend-secret-es
  namespace: rnld
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-css
  target:
    name: pgsqlmanager-backend-secret
  data:
  - secretKey: JWT_SECRET
    remoteRef:
      key: PGMANAGER_JWT_SECRET
---
# Senha do role pgmanager no bots-db. Precisa existir no namespace do Cluster
# (data, lida pelo CNPG em managed.roles) e no do release (rnld, lida pelo
# backend) — pods não referenciam Secret de outro namespace.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rnld-postgres-manager-dpl-cnpg-admin-es
  namespace: data
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-css
  target:
    name: rnld-postgres-manager-dpl-cnpg-admin
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: pgmanager
        password: "{{ .password }}"
  data:
  - secretKey: password
    remoteRef:
      key: PGMANAGER_CNPG_PASSWORD
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rnld-postgres-manager-dpl-cnpg-admin-es
  namespace: rnld
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-css
  target:
    name: rnld-postgres-manager-dpl-cnpg-admin
    template:
      type: kubernetes.io/basic-auth
      data:
        username: pgmanager
        password: "{{ .password }}"
  data:
  - secretKey: password
    remoteRef:
      key: PGMANAGER_CNPG_PASSWORD
